
services:
  api:
    build: .
    container_name: apit-unibh-api
    expose:
      - "8000"
    volumes:
      - ./data:/app/data

  nginx:
    image: nginx:alpine
    container_name: apit-unibh-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
